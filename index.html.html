<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Números Primos</title>
    <!-- Importamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave para la aparición del resultado */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans text-slate-800">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 14.25L5.25 10.5m0 0l3.75-3.75M5.25 10.5h13.5" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold text-slate-800">¿Es Primo?</h1>
            <p class="text-slate-500 mt-2">Ingresa un número entero para verificar si es un número primo.</p>
        </div>

        <!-- Formulario/Input -->
        <div class="space-y-4">
            <div>
                <label for="numberInput" class="block text-sm font-medium text-slate-700 mb-1">Número a evaluar</label>
                <input 
                    type="number" 
                    id="numberInput" 
                    placeholder="Ej. 7, 13, 42..." 
                    class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg"
                >
            </div>
            
            <button 
                onclick="verificarPrimo()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-200 shadow-md hover:shadow-lg flex justify-center items-center gap-2"
            >
                Verificar
            </button>
        </div>

        <!-- Área de Resultados -->
        <div id="resultado" class="mt-6 hidden fade-in">
            <!-- El contenido del resultado se inyectará aquí desde JavaScript -->
        </div>
    </div>

    <!-- Lógica de la aplicación -->
    <script>
        // Función principal que se ejecuta al hacer clic en el botón
        function verificarPrimo() {
            const input = document.getElementById('numberInput');
            const resultadoDiv = document.getElementById('resultado');
            const valor = input.value;

            // Restablecer estilos previos del resultado
            resultadoDiv.className = 'mt-6 p-5 rounded-xl border fade-in';
            resultadoDiv.classList.remove('hidden');

            // 1. Validar que no esté vacío
            if (valor.trim() === '') {
                mostrarMensaje(resultadoDiv, '⚠️ Por favor, ingresa un número.', 'bg-yellow-50', 'border-yellow-200', 'text-yellow-800');
                return;
            }

            const num = Number(valor);

            // 2. Validar que sea un número entero
            if (!Number.isInteger(num)) {
                mostrarMensaje(resultadoDiv, '⚠️ El número debe ser un entero sin decimales.', 'bg-yellow-50', 'border-yellow-200', 'text-yellow-800');
                return;
            }

            // 3. Validar números menores o iguales a 1 (no son primos por definición)
            if (num <= 1) {
                mostrarMensaje(
                    resultadoDiv, 
                    `El número <strong>${num}</strong> <span class="text-red-600 font-bold">NO</span> es primo.<br><span class="text-sm mt-2 block opacity-80">Los números primos deben ser mayores que 1.</span>`, 
                    'bg-red-50', 
                    'border-red-200', 
                    'text-red-900'
                );
                return;
            }

            // 4. Algoritmo para verificar si es primo
            let esPrimo = true;
            let divisorEncontrado = null;

            // Optimizaciones: descartar divisibles por 2 o 3 rápido
            if (num > 3) {
                if (num % 2 === 0) {
                    esPrimo = false;
                    divisorEncontrado = 2;
                } else if (num % 3 === 0) {
                    esPrimo = false;
                    divisorEncontrado = 3;
                } else {
                    // Solo revisamos los números de la forma 6k ± 1 hasta la raíz cuadrada
                    for (let i = 5; i * i <= num; i += 6) {
                        if (num % i === 0) {
                            esPrimo = false;
                            divisorEncontrado = i;
                            break;
                        }
                        if (num % (i + 2) === 0) {
                            esPrimo = false;
                            divisorEncontrado = i + 2;
                            break;
                        }
                    }
                }
            }

            // 5. Mostrar el resultado final
            if (esPrimo) {
                mostrarMensaje(
                    resultadoDiv, 
                    `<div class="flex items-center gap-2 mb-1"><span class="text-2xl">✨</span> <strong class="text-xl">¡Sí es primo!</strong></div>El número <strong>${num}</strong> solo es divisible por 1 y por sí mismo.`, 
                    'bg-green-50', 
                    'border-green-200', 
                    'text-green-900'
                );
            } else {
                mostrarMensaje(
                    resultadoDiv, 
                    `<strong class="text-lg">No es primo</strong><br>El número <strong>${num}</strong> es divisible por ${divisorEncontrado}.`, 
                    'bg-red-50', 
                    'border-red-200', 
                    'text-red-900'
                );
            }
        }

        // Función auxiliar para pintar los mensajes en el contenedor
        function mostrarMensaje(elemento, html, bgClass, borderClass, textClass) {
            elemento.classList.add(bgClass, borderClass, textClass);
            elemento.innerHTML = html;
        }

        // Permitir que la tecla "Enter" dispare la función de verificar
        document.getElementById('numberInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verificarPrimo();
            }
        });
    </script>
</body>
</html>
